<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no">
<link rel="stylesheet" href="desktop.css">
<style>
	@font-face{font-family:'Merriweather';src:url(img/Merriweather-Black.ttf);font-weight:bold;}
	@font-face{font-family:'Merriweather';src:url(img/Merriweather-Black.ttf);}
	html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent;-webkit-text-size-adjust:none;text-size-adjust:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
	body{font-family:Tahoma,Arial,sans-serif;color:#fff;font-size:13px;}
	#game{position:absolute;left:0;top:0;right:0;bottom:0;overflow:hidden;}
	#rows{position:absolute;left:0;top:0;right:0;bottom:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;}
	.row{display:none!important;padding-bottom:0;}
	.row.ccShown{display:block!important;}
	.row .rowSpecial{display:block;min-height:100%;}
	.separatorBottom{display:none;}
	body .icon,body .crate,body .usesIcon{background-image:url(img/icons.png);}
	#tooltipAnchor{pointer-events:none;}
	#ccFloat{position:absolute;pointer-events:none;z-index:100000;font-weight:bold;color:#fff;text-shadow:0 1px 2px #000;font-size:14px;transition:transform 1.2s ease-out,opacity 1.2s ease-out;}
</style>
</head>
<body>
<div id="game">
	<div id="rows">
		<div class="row enabled onMinigame" id="row2"><div class="separatorBottom"></div><div class="rowSpecial" id="rowSpecial2"></div></div>
		<div class="row enabled onMinigame" id="row5"><div class="separatorBottom"></div><div class="rowSpecial" id="rowSpecial5"></div></div>
		<div class="row enabled onMinigame" id="row6"><div class="separatorBottom"></div><div class="rowSpecial" id="rowSpecial6"></div></div>
		<div class="row enabled onMinigame" id="row7"><div class="separatorBottom"></div><div class="rowSpecial" id="rowSpecial7"></div></div>
	</div>
	<div id="sparkles"></div>
	<div id="darken"></div>
	<div id="promptAnchor"><div id="prompt" class="framed"><div id="promptContent"></div><div class="close" id="promptClose" onclick="Game.ClosePrompt();">x</div></div></div>
	<div id="tooltipAnchor"><div id="tooltip" class="framed"></div></div>
</div>
<script src="desktop-helpers.js"></script>
<script>if (typeof Langs==="undefined") var Langs={EN:{file:"EN",nameEN:"English",name:"English",isEN:true}};</script>
<script src="EN.js"></script>
<script src="desktop-ui.js"></script>
<script src="shim.js"></script>
</body>
</html>
