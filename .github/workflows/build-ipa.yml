name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec cookieswift-project.yml

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project CookieSwift.xcodeproj \
            -scheme CookieSwift \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 80

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CookieClicker.app Payload/
          zip -qry CookieClicker.ipa Payload
          ls -lh CookieClicker.ipa

      - name: Upload IPA as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CookieClicker-ipa
          path: CookieClicker.ipa

      - name: Publish IPA as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" CookieClicker.ipa \
            --title "Cookie Clicker build ${{ github.run_number }}" \
            --notes "Unsigned IPA (all-Swift app). Install with Sideloadly or AltStore."
