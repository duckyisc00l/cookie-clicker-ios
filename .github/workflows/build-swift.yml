name: Build Swift IPA

on:
  push:
    branches: [main]
    paths:
      - "SwiftGame/**"
      - "swift-project.yml"
      - ".github/workflows/build-swift.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec swift-project.yml

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project CookieClickerSwift.xcodeproj \
            -scheme CookieClickerSwift \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" | head -n 200

      - name: Show errors
        if: failure()
        run: grep -E "error:" -A3 build.log | head -n 400

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CookieClickerSwift.app Payload/
          zip -qry CookieClickerSwift.ipa Payload
          ls -lh CookieClickerSwift.ipa

      - name: Publish IPA as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "swift-build-${{ github.run_number }}" CookieClickerSwift.ipa \
            --title "Cookie Clicker Swift build ${{ github.run_number }}" \
            --notes "The game rewritten in Swift. Unsigned IPA. Install with Sideloadly or AltStore."
