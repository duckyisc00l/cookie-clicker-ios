name: Swift port

on:
  push:
    branches: [swift-port]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec cookieswift-project.yml

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project CookieSwift.xcodeproj -scheme CookieSwift -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES ARCHS=arm64 build > build.log 2>&1 || true
          grep -E "error:" build.log | sort -u | head -n 300 > errors.txt || true
          echo "errors: $(wc -l < errors.txt)"
          cat errors.txt
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            errors.txt

      - name: Screenshots
        if: success()
        run: |
          set -x
          UDID=$(xcrun simctl create shot "iPhone 16" 2>/dev/null || xcrun simctl create shot "iPhone 15")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(ls -d build/Build/Products/Debug-iphonesimulator/CookieClicker.app)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          if [ -f CookieSwift/Tests/save.txt ]; then
            DATA=$(xcrun simctl get_app_container "$UDID" com.duckyisc00l.cookieclicker data)
            mkdir -p "$DATA/Library/Application Support/Saves"
            cp CookieSwift/Tests/save.txt "$DATA/Library/Application Support/Saves/CookieClickerSave.txt"
          fi
          for scr in cookie store special stats misc; do
            xcrun simctl terminate "$UDID" com.duckyisc00l.cookieclicker || true
            SIMCTL_CHILD_CC_SCREEN=$scr xcrun simctl launch "$UDID" com.duckyisc00l.cookieclicker
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$scr.png"
          done
          xcrun simctl spawn "$UDID" log show --last 2m --predicate 'process == "CookieClicker"' --style compact | tail -n 200 > shots/log.txt || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots
