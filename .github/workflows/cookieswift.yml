name: Swift port

on:
  push:
    branches: [swift-port]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec cookieswift-project.yml

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project CookieSwift.xcodeproj -scheme CookieSwift -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES ARCHS=arm64 build > build.log 2>&1 || true
          grep -E "error:" build.log | sort -u | head -n 300 > errors.txt || true
          echo "errors: $(wc -l < errors.txt)"
          cat errors.txt
          grep -q "BUILD SUCCEEDED" build.log

      - name: Screenshots
        if: success()
        run: |
          set -x
          mkdir -p shots
          UDID=$(xcrun simctl create shot "iPhone 16" 2>/dev/null || xcrun simctl create shot "iPhone 15")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=build/Build/Products/Debug-iphonesimulator/CookieClicker.app
          xcrun simctl install "$UDID" "$APP"
          if [ -f CookieSwift/Tests/save.txt ]; then
            DATA=$(xcrun simctl get_app_container "$UDID" com.duckyisc00l.cookieclicker data)
            mkdir -p "$DATA/Library/Application Support/Saves"
            cp CookieSwift/Tests/save.txt "$DATA/Library/Application Support/Saves/CookieClickerSave.txt"
          fi
          SCREENS="${{ vars.SHOT_SCREENS }}"
          [ -z "$SCREENS" ] && SCREENS=$(cat CookieSwift/Tests/shots.txt 2>/dev/null || echo "cookie store special stats misc")
          for scr in $SCREENS; do
            xcrun simctl terminate "$UDID" com.duckyisc00l.cookieclicker || true
            SIMCTL_CHILD_CC_SHOT=$scr xcrun simctl launch "$UDID" com.duckyisc00l.cookieclicker
            sleep 7
            xcrun simctl io "$UDID" screenshot "shots/$scr.png"
          done
          DATA=$(xcrun simctl get_app_container "$UDID" com.duckyisc00l.cookieclicker data)
          cp "$DATA/Documents/debug.txt" shots/debug.txt 2>/dev/null || true
          xcrun simctl spawn "$UDID" log show --last 5m --predicate 'process == "CookieClicker"' --style compact 2>/dev/null | grep -E "\[cc\]|error|fault|Fatal|crash" | tail -n 300 > shots/log.txt || true
          find "$HOME/Library/Logs/DiagnosticReports" -name "CookieClicker*" -exec cp {} shots/ \; 2>/dev/null || true

      - name: Publish results to the ci-shots branch
        if: always()
        run: |
          mkdir -p out && cp -R shots/. out/ 2>/dev/null || true
          cp errors.txt out/ 2>/dev/null || true
          grep -E "error:|warning:" build.log | sort -u | head -n 500 > out/diagnostics.txt 2>/dev/null || true
          echo "${{ github.sha }}" > out/sha.txt
          cd out
          git init -q -b ci-shots
          git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "results ${{ github.sha }}" || true
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
